<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Recording only: the simulator asks for system-ui, which on a bare Linux box resolves to
     DejaVu Sans; this makes Chromium draw it in Inter, the face the title cards use. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Roboto</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
