AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Trackside MCP server for Alexa+: one arm64 Lambda behind an API Gateway HTTP API, serving an
  odds-free racing snapshot from Trackside's own bucket, with a Cognito user pool as its OAuth
  2.1 authorization server, a DynamoDB table that remembers each listener across sessions,
  plus a web simulator of the Alexa+ experience under /sim (a second
  Lambda that drives the MCP server with a Claude model on Amazon Bedrock). Every resource is
  named trackside-* and tagged Project=trackside.

Parameters:
  ArtifactBucket:
    Type: String
    Description: Trackside's own bucket (trackside-*), holding the Lambda zip and the snapshot.
    AllowedPattern: "trackside-.*"
  CodeKey:
    Type: String
    Description: Key of the Lambda zip (a `bootstrap` binary) in ArtifactBucket.
  SnapshotKey:
    Type: String
    Default: snapshots/latest.json.gz
  BedrockModel:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Bedrock inference profile that rewords explain_race for the ear. The au. profile keeps
      requests in Australian regions. Empty turns Bedrock off (the tool uses its template).
  SimCodeKey:
    Type: String
    Default: ""
    Description: Key of the simulator's Lambda zip in ArtifactBucket. Empty leaves /sim out.
  SimModel:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Bedrock model or inference profile the simulator talks through. The au. profile keeps
      inference in Australian regions; the same model as BedrockModel means one Bedrock quota
      covers both.
  SimToday:
    Type: String
    Default: ""
    Description: >-
      The date (YYYY-MM-DD) the simulator treats as today, for demos on a snapshot of past
      racing. Empty means the real date in Melbourne.
  RefreshCodeKey:
    Type: String
    Default: ""
    Description: >-
      Key of the snapshot builder's Lambda zip in ArtifactBucket. With ArchiveEnv set, it
      rebuilds the snapshot twice a day. Empty leaves the daily refresh out.
  ArchiveEnv:
    Type: String
    Default: ""
    Description: >-
      The racing archive's environment (the <env> in hr-<env>-gamble-<account>), read-only.
  SnapshotFrom:
    Type: String
    Default: "2026-09-22"
    Description: First date (YYYY-MM-DD) the daily refresh puts in the snapshot.
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      Email address told when a health alarm fires (the refresh fails, the snapshot goes stale,
      the public endpoint or Cognito stops answering, or the server errors). AWS sends a
      confirmation email first. Empty keeps the alarms visible in CloudWatch only, with no SNS
      topic.
  RateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second the API accepts before throttling.
  BurstLimit:
    Type: Number
    Default: 20
  OAuthCallbackUrls:
    Type: CommaDelimitedList
    Description: >-
      Redirect URIs allowed for the user sign-in client: MCP Inspector, Claude custom
      connectors, and the Alexa+ account-linking redirect URLs once the add-on is registered.
    Default: http://localhost:6274/oauth/callback,https://claude.ai/api/mcp/auth_callback
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Public hostname for the API (e.g. mcp.racingaidataset.com.au). Needs CertificateArn.
      The execute-api URL keeps working alongside it.
  CertificateArn:
    Type: String
    Default: ""
    Description: An issued ACM certificate for DomainName, in this region (deploy.sh requests it).
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone for DomainName, when it is in this account. Leave empty when DNS is
      hosted elsewhere and add a CNAME to the RegionalHostname output there.

Conditions:
  HasDomain: !And [!Not [!Equals [!Ref DomainName, ""]], !Not [!Equals [!Ref CertificateArn, ""]]]
  HasZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  HasSim: !Not [!Equals [!Ref SimCodeKey, ""]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasRefresh: !And [!Not [!Equals [!Ref RefreshCodeKey, ""]], !Not [!Equals [!Ref ArchiveEnv, ""]]]

Resources:
  # OAuth 2.1 for Alexa+: a service client (client_credentials, discovery only) and a user
  # client (authorization code + PKCE, tool calls). The server checks the tokens itself.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: trackside-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false, RequireUppercase: false }
      UserPoolTags: { Project: trackside }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "trackside-${AWS::AccountId}"

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: trackside
      Name: Trackside MCP
      Scopes:
        - { ScopeName: "mcp:service", ScopeDescription: "Discover Trackside's tools" }
        - { ScopeName: "mcp:tools", ScopeDescription: "Use Trackside's tools for the signed-in user" }

  ServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-service
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [trackside/mcp:service]
      AccessTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes }

  # For scripts/token.sh and the post-deploy smoke test: machine tokens with both scopes.
  # Cognito only puts custom scopes in tokens from its OAuth endpoints, so a scripted user
  # sign-in can't stand in for it.
  SmokeClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-smoke
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [trackside/mcp:service, trackside/mcp:tools]
      AccessTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes }

  UserClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-user
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, trackside/mcp:service, trackside/mcp:tools]
      # Plus the simulator's account-linking callback on each hostname the API answers on.
      CallbackURLs: !Split
        - ","
        - !Join
          - ","
          - - !Join [",", !Ref OAuthCallbackUrls]
            - !If
              - HasDomain
              - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/sim/callback,https://${DomainName}/sim/callback"
              - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/sim/callback"
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, RefreshToken: days }

  # What Trackside remembers about each signed-in listener across sessions: followed horses,
  # home state and when they last heard their stable report. One item per Cognito subject;
  # `forget_me` deletes it. On-demand, so it costs nothing while nobody asks.
  MemoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: trackside-listeners
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: user, AttributeType: S }]
      KeySchema: [{ AttributeName: user, KeyType: HASH }]
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      Tags: [{ Key: Project, Value: trackside }]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/trackside-mcp
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: trackside }]

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trackside-mcp-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trackside-mcp-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/snapshots/*"
              # Listener memory: one item per user, read, written and deleted by key only.
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt MemoryTable.Arn
              # explain_race: Converse through the inference profile, which routes to the
              # Anthropic or Amazon Nova foundation models in the profile's regions.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - "arn:aws:bedrock:*::foundation-model/amazon.nova-*"
      Tags: [{ Key: Project, Value: trackside }]

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: trackside-mcp
      Description: Trackside MCP server (Streamable HTTP, stateless)
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 1024
      Timeout: 20
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TRACKSIDE_SNAPSHOT: !Sub "s3://${ArtifactBucket}/${SnapshotKey}"
          TRACKSIDE_AUTH_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
          TRACKSIDE_AUTH_DOMAIN: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
          TRACKSIDE_AUTH_CLIENTS: !Join [",", [!Ref ServiceClient, !Ref UserClient, !Ref SmokeClient]]
          # Cognito's names for the scopes; clients read them from the metadata and must ask
          # Cognito for exactly these.
          TRACKSIDE_SCOPE_SERVICE: trackside/mcp:service
          TRACKSIDE_SCOPE_TOOLS: trackside/mcp:tools
          TRACKSIDE_BEDROCK_MODEL: !Ref BedrockModel
          TRACKSIDE_MEMORY_TABLE: !Ref MemoryTable
          RUST_LOG: info
      Tags: [{ Key: Project, Value: trackside }]

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: trackside-mcp
      ProtocolType: HTTP
      Description: Public MCP endpoint for Trackside (/mcp)
      Tags: { Project: trackside }

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 25000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref RateLimit
        ThrottlingBurstLimit: !Ref BurstLimit
      Tags: { Project: trackside }

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # The simulator: a web page and a small server under /sim that plays the Alexa+ side of the
  # conversation. A Claude model on Bedrock picks the tools; the server calls them on the MCP
  # server above over HTTPS with the linked user's Cognito token, just as Alexa+ would.
  SimLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasSim
    Properties:
      LogGroupName: /aws/lambda/trackside-sim
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: trackside }]

  SimRole:
    Type: AWS::IAM::Role
    Condition: HasSim
    Properties:
      RoleName: trackside-sim-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trackside-sim-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${SimLogGroup.Arn}:*"
              # A cross-region inference profile (au., global.) runs the model in other
              # regions, so the foundation-model ARN is any region.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - "arn:aws:bedrock:*::foundation-model/amazon.nova-*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              # Spoken answers (Polly voices aren't resources, so this can't be narrower).
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"
      Tags: [{ Key: Project, Value: trackside }]

  SimFunction:
    Type: AWS::Lambda::Function
    Condition: HasSim
    DependsOn: SimLogGroup
    Properties:
      FunctionName: trackside-sim
      Description: Trackside simulator (a simulated Alexa+ experience over the MCP server)
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt SimRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref SimCodeKey
      Environment:
        Variables:
          TRACKSIDE_SIM_MCP_URL: !If [HasDomain, !Sub "https://${DomainName}/mcp", !Sub "${Api.ApiEndpoint}/mcp"]
          TRACKSIDE_SIM_MODEL: !Ref SimModel
          TRACKSIDE_SIM_TODAY: !Ref SimToday
          TRACKSIDE_SIM_VOICE: Olivia
          TRACKSIDE_SIM_AUTH_DOMAIN: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
          TRACKSIDE_SIM_CLIENT_ID: !Ref UserClient
          TRACKSIDE_SIM_CLIENT_SECRET: !GetAtt UserClient.ClientSecret
          RUST_LOG: info
      Tags: [{ Key: Project, Value: trackside }]

  SimIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: HasSim
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SimFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  SimRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasSim
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /sim
      Target: !Sub "integrations/${SimIntegration}"

  SimProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasSim
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /sim/{proxy+}
      Target: !Sub "integrations/${SimIntegration}"

  SimInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasSim
    Properties:
      FunctionName: !Ref SimFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # The custom hostname. The server builds its OAuth metadata URLs from the Host header, so
  # each hostname advertises itself and the execute-api URL keeps working.
  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags: { Project: trackside }

  CustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: Stage
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref CustomDomain
      Stage: $default

  CustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt CustomDomain.RegionalHostedZoneId

  # Daily refresh: rebuilds the odds-free snapshot from the racing archive (read-only) after
  # the day's results and again early for the next day's fields, then recycles the MCP
  # function so it serves the new snapshot.
  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasRefresh
    Properties:
      LogGroupName: /aws/lambda/trackside-refresh
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: trackside }]

  RefreshRole:
    Type: AWS::IAM::Role
    Condition: HasRefresh
    Properties:
      RoleName: trackside-refresh-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trackside-refresh-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${RefreshLogGroup.Arn}:*"
              # The archive is read-only to Trackside.
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-gamble-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-gamble-${AWS::AccountId}/*"
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-sectional-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-sectional-${AWS::AccountId}/*"
              # Put to publish the snapshot; Get so the health probe can read its age.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/snapshots/*"
              - Effect: Allow
                Action: lambda:UpdateFunctionConfiguration
                Resource: !GetAtt Function.Arn
      Tags: [{ Key: Project, Value: trackside }]

  RefreshFunction:
    Type: AWS::Lambda::Function
    Condition: HasRefresh
    DependsOn: RefreshLogGroup
    Properties:
      FunctionName: trackside-refresh
      Description: Rebuilds Trackside's racing snapshot from the archive (read-only)
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt RefreshRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref RefreshCodeKey
      Environment:
        Variables:
          HR_ENV: !Ref ArchiveEnv
          TRACKSIDE_SNAPSHOT_FROM: !Ref SnapshotFrom
          TRACKSIDE_SNAPSHOT_UPLOAD: !Sub "s3://${ArtifactBucket}/${SnapshotKey}"
          TRACKSIDE_MCP_FUNCTION: !Ref Function
          TRACKSIDE_PROBE_URL: !If [HasDomain, !Sub "https://${DomainName}", !GetAtt Api.ApiEndpoint]
          TRACKSIDE_PROBE_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
          TRACKSIDE_PROBE_SIM: !If [HasSim, "1", "0"]
      Tags: [{ Key: Project, Value: trackside }]

  # 12:00 and 20:00 UTC: about 10 or 11 pm in Melbourne after the day's results, and about 6
  # or 7 am with the day's final fields.
  RefreshSchedule:
    Type: AWS::Events::Rule
    Condition: HasRefresh
    Properties:
      Name: trackside-refresh
      Description: Rebuild Trackside's racing snapshot twice a day
      ScheduleExpression: cron(0 12,20 * * ? *)
      State: ENABLED
      Targets:
        - Id: refresh
          Arn: !GetAtt RefreshFunction.Arn

  RefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasRefresh
    Properties:
      FunctionName: !Ref RefreshFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RefreshSchedule.Arn

  # Hourly health probe, run by the same function: the public endpoint asks for a token, the
  # sign-in metadata and Cognito answer, the simulator loads and the snapshot is fresh.
  ProbeSchedule:
    Type: AWS::Events::Rule
    Condition: HasRefresh
    Properties:
      Name: trackside-probe
      Description: Check Trackside's public endpoint, sign-in and data freshness every hour
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Id: probe
          Arn: !GetAtt RefreshFunction.Arn
          Input: '{"probe": true}'

  ProbeInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasRefresh
    Properties:
      FunctionName: !Ref RefreshFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProbeSchedule.Arn

  # Alarms, so a broken stack during judging is noticed before a judge notices it.
  # Only with an AlertEmail: creating the topic needs sns permissions on the deploy role.
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: trackside-alerts
      DisplayName: Trackside alerts
      Tags: [{ Key: Project, Value: trackside }]

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # A failed refresh or a failed probe (endpoint down, Cognito down, snapshot stale).
  RefreshOrProbeFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasRefresh
    Properties:
      AlarmName: trackside-refresh-or-probe-failed
      AlarmDescription: >-
        The data refresh or the hourly health probe failed. The probe's log in
        /aws/lambda/trackside-refresh says which check.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref RefreshFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  # The probe itself stopped running, so nothing above would fire.
  ProbeSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasRefresh
    Properties:
      AlarmName: trackside-probe-silent
      AlarmDescription: The hourly health probe has not run for three hours.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref RefreshFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  McpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: trackside-mcp-errors
      AlarmDescription: The MCP server function failed five or more times in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Function }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: trackside-api-5xx
      AlarmDescription: The public API returned five or more server errors in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref Api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  # More than half of the explain_race answers that asked Bedrock fell back to the template:
  # Bedrock is slow, refusing (model access, quota) or answering in words Trackside drops.
  # Listeners still hear the template sentence, so this is a quality alarm, not an outage.
  BedrockFallbackRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: trackside-bedrock-fallback-rate
      AlarmDescription: >-
        More than half of explain_race's Bedrock answers in 15 minutes (at least three asked)
        fell back to the template. The Reason property on the Trackside metric lines in
        /aws/lambda/trackside-mcp says whether it was a timeout, an error or a rejected answer.
      Metrics:
        - Id: fallbacks
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: Trackside
              MetricName: BedrockFallback
              Dimensions: [{ Name: Tool, Value: explain_race }, { Name: Outcome, Value: found }]
            Period: 900
            Stat: Sum
        - Id: explained
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: Trackside
              MetricName: Calls
              Dimensions: [{ Name: Tool, Value: explain_race }, { Name: Outcome, Value: found }]
            Period: 900
            Stat: Sum
        - Id: rate
          Label: Bedrock fallback rate
          Expression: IF(explained >= 3, FILL(fallbacks, 0) / explained, 0)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0.5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  # One page for the judging window: Lambda and API Gateway's own metrics beside the
  # Trackside namespace the server writes as Embedded Metric Format log lines (see
  # crates/trackside-mcp/src/telemetry.rs) and the probe's snapshot age.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: trackside
      DashboardBody: !Sub |
        {
          "start": "-PT24H",
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "MCP Lambda duration (ms)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${Function}", {"stat": "p50", "label": "p50"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${Function}", {"stat": "p99", "label": "p99"}]
                ]
              }
            },
            {
              "type": "log", "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Cold starts: Init Duration from the REPORT lines (ms)",
                "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter @type = \"REPORT\" and ispresent(@initDuration) | stats count(*) as cold_starts, pct(@initDuration, 50) as init_p50_ms, pct(@initDuration, 99) as init_p99_ms by bin(1h)"
              }
            },
            {
              "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Server start: snapshot load (ms) and cold starts",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 3600,
                "metrics": [
                  ["Trackside", "SnapshotLoadMs", {"stat": "p50", "label": "snapshot load p50"}],
                  ["Trackside", "SnapshotLoadMs", {"stat": "Maximum", "label": "snapshot load max"}],
                  ["Trackside", "ColdStart", {"stat": "Sum", "label": "cold starts", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Tool calls by tool",
                "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "period": 300,
                "metrics": [
                  [{"expression": "SELECT SUM(Calls) FROM SCHEMA(Trackside, Outcome, Tool) GROUP BY Tool", "id": "calls", "label": "", "period": 300}]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Tool latency p50 by tool, answered calls (ms)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  [{"expression": "SEARCH('{Trackside,Outcome,Tool} MetricName=\"LatencyMs\" Outcome=\"found\"', 'p50', 300)", "id": "p50", "label": ""}]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Tool calls by outcome",
                "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "period": 300,
                "metrics": [
                  [{"expression": "SELECT SUM(Calls) FROM SCHEMA(Trackside, Outcome, Tool) GROUP BY Outcome", "id": "outcomes", "label": "", "period": 300}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "Errors",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${Function}", {"stat": "Sum", "label": "Lambda errors"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${Function}", {"stat": "Sum", "label": "Lambda throttles"}],
                  [{"expression": "SELECT SUM(Calls) FROM SCHEMA(Trackside, Outcome, Tool) WHERE Outcome = 'error'", "id": "toolerrors", "label": "tool calls that errored", "period": 300}]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "API Gateway requests, 4xx and 5xx",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${Api}", {"stat": "Sum", "label": "requests", "yAxis": "right"}],
                  ["AWS/ApiGateway", "4xx", "ApiId", "${Api}", {"stat": "Sum", "label": "4xx"}],
                  ["AWS/ApiGateway", "5xx", "ApiId", "${Api}", {"stat": "Sum", "label": "5xx"}]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "Bedrock: fallbacks to the template, and answer time (ms)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["Trackside", "BedrockFallback", "Outcome", "found", "Tool", "explain_race", {"stat": "Sum", "label": "fallbacks"}],
                  ["Trackside", "Calls", "Outcome", "found", "Tool", "explain_race", {"stat": "Sum", "label": "explain_race answers"}],
                  ["Trackside", "BedrockMs", "Outcome", "found", "Tool", "explain_race", {"stat": "p50", "label": "Bedrock p50 ms", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 18, "width": 8, "height": 6,
              "properties": {
                "title": "Snapshot age from the hourly probe (hours)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 3600,
                "metrics": [
                  ["Trackside", "SnapshotAgeHours", {"stat": "Maximum", "label": "snapshot age"}]
                ],
                "annotations": {"horizontal": [{"label": "probe limit", "value": 26}]}
              }
            },
            {
              "type": "alarm", "x": 8, "y": 18, "width": 16, "height": 6,
              "properties": {
                "title": "Alarms",
                "alarms": [
                  "${McpErrorsAlarm.Arn}",
                  "${Api5xxAlarm.Arn}",
                  "${BedrockFallbackRateAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  McpUrl:
    Description: Point MCP clients (Inspector, Alexa+) here.
    Value: !If [HasDomain, !Sub "https://${DomainName}/mcp", !Sub "${Api.ApiEndpoint}/mcp"]
  ApiUrl:
    Description: The execute-api URL, which keeps working alongside a custom domain.
    Value: !Sub "${Api.ApiEndpoint}/mcp"
  RegionalHostname:
    Condition: HasDomain
    Description: CNAME target for DomainName when its DNS is hosted outside Route 53.
    Value: !GetAtt CustomDomain.RegionalDomainName
  FunctionName:
    Value: !Ref Function
  DashboardUrl:
    Description: The CloudWatch dashboard (tool calls, latency, cold starts, errors, Bedrock, snapshot age).
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/trackside"
  SimUrl:
    Condition: HasSim
    Description: The simulated Alexa+ experience, for demos and testing.
    Value: !If [HasDomain, !Sub "https://${DomainName}/sim", !Sub "${Api.ApiEndpoint}/sim"]
  OAuthDomain:
    Description: Cognito's authorize and token endpoints live here.
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  UserPoolId:
    Value: !Ref UserPool
  ServiceClientId:
    Description: client_credentials client (scope trackside/mcp:service). Secret via describe-user-pool-client.
    Value: !Ref ServiceClient
  SmokeClientId:
    Description: Test-only client_credentials client with both scopes, used by scripts/token.sh.
    Value: !Ref SmokeClient
  UserClientId:
    Description: Sign-in client for Alexa+, Claude and Inspector (code + PKCE). Secret via describe-user-pool-client.
    Value: !Ref UserClient
