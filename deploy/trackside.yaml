AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Trackside MCP server for Alexa+: one arm64 Lambda behind an API Gateway HTTP API, serving an
  odds-free racing snapshot from Trackside's own bucket, with a Cognito user pool as its OAuth
  2.1 authorization server. Every resource is named trackside-* and tagged Project=trackside.

Parameters:
  ArtifactBucket:
    Type: String
    Description: Trackside's own bucket (trackside-*), holding the Lambda zip and the snapshot.
    AllowedPattern: "trackside-.*"
  CodeKey:
    Type: String
    Description: Key of the Lambda zip (a `bootstrap` binary) in ArtifactBucket.
  SnapshotKey:
    Type: String
    Default: snapshots/latest.json.gz
  RateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second the API accepts before throttling.
  BurstLimit:
    Type: Number
    Default: 20
  OAuthCallbackUrls:
    Type: CommaDelimitedList
    Description: >-
      Redirect URIs allowed for the user sign-in client: MCP Inspector, Claude custom
      connectors, and the Alexa+ account-linking redirect URLs once the add-on is registered.
    Default: http://localhost:6274/oauth/callback,https://claude.ai/api/mcp/auth_callback
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Public hostname for the API (e.g. mcp.racingaidataset.com.au). Needs CertificateArn.
      The execute-api URL keeps working alongside it.
  CertificateArn:
    Type: String
    Default: ""
    Description: An issued ACM certificate for DomainName, in this region (deploy.sh requests it).
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone for DomainName, when it is in this account. Leave empty when DNS is
      hosted elsewhere and add a CNAME to the RegionalHostname output there.

Conditions:
  HasDomain: !And [!Not [!Equals [!Ref DomainName, ""]], !Not [!Equals [!Ref CertificateArn, ""]]]
  HasZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]

Resources:
  # OAuth 2.1 for Alexa+: a service client (client_credentials, discovery only) and a user
  # client (authorization code + PKCE, tool calls). The server checks the tokens itself.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: trackside-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false, RequireUppercase: false }
      UserPoolTags: { Project: trackside }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "trackside-${AWS::AccountId}"

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: trackside
      Name: Trackside MCP
      Scopes:
        - { ScopeName: "mcp:service", ScopeDescription: "Discover Trackside's tools" }
        - { ScopeName: "mcp:tools", ScopeDescription: "Use Trackside's tools for the signed-in user" }

  ServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-service
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [trackside/mcp:service]
      AccessTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes }

  # For scripts/token.sh and the post-deploy smoke test: machine tokens with both scopes.
  # Cognito only puts custom scopes in tokens from its OAuth endpoints, so a scripted user
  # sign-in can't stand in for it.
  SmokeClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-smoke
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [trackside/mcp:service, trackside/mcp:tools]
      AccessTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes }

  UserClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-user
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, trackside/mcp:service, trackside/mcp:tools]
      CallbackURLs: !Ref OAuthCallbackUrls
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, RefreshToken: days }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/trackside-mcp
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: trackside }]

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trackside-mcp-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trackside-mcp-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/snapshots/*"
      Tags: [{ Key: Project, Value: trackside }]

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: trackside-mcp
      Description: Trackside MCP server (Streamable HTTP, stateless)
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 1024
      Timeout: 20
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TRACKSIDE_SNAPSHOT: !Sub "s3://${ArtifactBucket}/${SnapshotKey}"
          TRACKSIDE_AUTH_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
          TRACKSIDE_AUTH_DOMAIN: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
          TRACKSIDE_AUTH_CLIENTS: !Join [",", [!Ref ServiceClient, !Ref UserClient, !Ref SmokeClient]]
          # Cognito's names for the scopes; clients read them from the metadata and must ask
          # Cognito for exactly these.
          TRACKSIDE_SCOPE_SERVICE: trackside/mcp:service
          TRACKSIDE_SCOPE_TOOLS: trackside/mcp:tools
          RUST_LOG: info
      Tags: [{ Key: Project, Value: trackside }]

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: trackside-mcp
      ProtocolType: HTTP
      Description: Public MCP endpoint for Trackside (/mcp)
      Tags: { Project: trackside }

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 25000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref RateLimit
        ThrottlingBurstLimit: !Ref BurstLimit
      Tags: { Project: trackside }

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # The custom hostname. The server builds its OAuth metadata URLs from the Host header, so
  # each hostname advertises itself and the execute-api URL keeps working.
  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags: { Project: trackside }

  CustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: Stage
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref CustomDomain
      Stage: $default

  CustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt CustomDomain.RegionalHostedZoneId

Outputs:
  McpUrl:
    Description: Point MCP clients (Inspector, Alexa+) here.
    Value: !If [HasDomain, !Sub "https://${DomainName}/mcp", !Sub "${Api.ApiEndpoint}/mcp"]
  ApiUrl:
    Description: The execute-api URL, which keeps working alongside a custom domain.
    Value: !Sub "${Api.ApiEndpoint}/mcp"
  RegionalHostname:
    Condition: HasDomain
    Description: CNAME target for DomainName when its DNS is hosted outside Route 53.
    Value: !GetAtt CustomDomain.RegionalDomainName
  FunctionName:
    Value: !Ref Function
  OAuthDomain:
    Description: Cognito's authorize and token endpoints live here.
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  UserPoolId:
    Value: !Ref UserPool
  ServiceClientId:
    Description: client_credentials client (scope trackside/mcp:service). Secret via describe-user-pool-client.
    Value: !Ref ServiceClient
  SmokeClientId:
    Description: Test-only client_credentials client with both scopes, used by scripts/token.sh.
    Value: !Ref SmokeClient
  UserClientId:
    Description: Sign-in client for Alexa+, Claude and Inspector (code + PKCE). Secret via describe-user-pool-client.
    Value: !Ref UserClient
