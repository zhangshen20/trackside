AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Trackside MCP server for Alexa+: one arm64 Lambda behind an API Gateway HTTP API, serving an
  odds-free racing snapshot from Trackside's own bucket, with a Cognito user pool as its OAuth
  2.1 authorization server, plus a web simulator of the Alexa+ experience under /sim (a second
  Lambda that drives the MCP server with a Claude model on Amazon Bedrock). Every resource is
  named trackside-* and tagged Project=trackside.

Parameters:
  ArtifactBucket:
    Type: String
    Description: Trackside's own bucket (trackside-*), holding the Lambda zip and the snapshot.
    AllowedPattern: "trackside-.*"
  CodeKey:
    Type: String
    Description: Key of the Lambda zip (a `bootstrap` binary) in ArtifactBucket.
  SnapshotKey:
    Type: String
    Default: snapshots/latest.json.gz
  BedrockModel:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Bedrock inference profile that rewords explain_race for the ear. The au. profile keeps
      requests in Australian regions. Empty turns Bedrock off (the tool uses its template).
  SimCodeKey:
    Type: String
    Default: ""
    Description: Key of the simulator's Lambda zip in ArtifactBucket. Empty leaves /sim out.
  SimModel:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Bedrock model or inference profile the simulator talks through. The au. profile keeps
      inference in Australian regions; the same model as BedrockModel means one Bedrock quota
      covers both.
  SimToday:
    Type: String
    Default: ""
    Description: >-
      The date (YYYY-MM-DD) the simulator treats as today, for demos on a snapshot of past
      racing. Empty means the real date in Melbourne.
  RefreshCodeKey:
    Type: String
    Default: ""
    Description: >-
      Key of the snapshot builder's Lambda zip in ArtifactBucket. With ArchiveEnv set, it
      rebuilds the snapshot twice a day. Empty leaves the daily refresh out.
  ArchiveEnv:
    Type: String
    Default: ""
    Description: >-
      The racing archive's environment (the <env> in hr-<env>-gamble-<account>), read-only.
  SnapshotFrom:
    Type: String
    Default: "2026-09-22"
    Description: First date (YYYY-MM-DD) the daily refresh puts in the snapshot.
  RateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second the API accepts before throttling.
  BurstLimit:
    Type: Number
    Default: 20
  OAuthCallbackUrls:
    Type: CommaDelimitedList
    Description: >-
      Redirect URIs allowed for the user sign-in client: MCP Inspector, Claude custom
      connectors, and the Alexa+ account-linking redirect URLs once the add-on is registered.
    Default: http://localhost:6274/oauth/callback,https://claude.ai/api/mcp/auth_callback
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Public hostname for the API (e.g. mcp.racingaidataset.com.au). Needs CertificateArn.
      The execute-api URL keeps working alongside it.
  CertificateArn:
    Type: String
    Default: ""
    Description: An issued ACM certificate for DomainName, in this region (deploy.sh requests it).
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone for DomainName, when it is in this account. Leave empty when DNS is
      hosted elsewhere and add a CNAME to the RegionalHostname output there.

Conditions:
  HasDomain: !And [!Not [!Equals [!Ref DomainName, ""]], !Not [!Equals [!Ref CertificateArn, ""]]]
  HasZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  HasSim: !Not [!Equals [!Ref SimCodeKey, ""]]
  HasRefresh: !And [!Not [!Equals [!Ref RefreshCodeKey, ""]], !Not [!Equals [!Ref ArchiveEnv, ""]]]

Resources:
  # OAuth 2.1 for Alexa+: a service client (client_credentials, discovery only) and a user
  # client (authorization code + PKCE, tool calls). The server checks the tokens itself.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: trackside-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false, RequireUppercase: false }
      UserPoolTags: { Project: trackside }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "trackside-${AWS::AccountId}"

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: trackside
      Name: Trackside MCP
      Scopes:
        - { ScopeName: "mcp:service", ScopeDescription: "Discover Trackside's tools" }
        - { ScopeName: "mcp:tools", ScopeDescription: "Use Trackside's tools for the signed-in user" }

  ServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-service
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [trackside/mcp:service]
      AccessTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes }

  # For scripts/token.sh and the post-deploy smoke test: machine tokens with both scopes.
  # Cognito only puts custom scopes in tokens from its OAuth endpoints, so a scripted user
  # sign-in can't stand in for it.
  SmokeClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-smoke
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [trackside/mcp:service, trackside/mcp:tools]
      AccessTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes }

  UserClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trackside-user
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, trackside/mcp:service, trackside/mcp:tools]
      # Plus the simulator's account-linking callback on each hostname the API answers on.
      CallbackURLs: !Split
        - ","
        - !Join
          - ","
          - - !Join [",", !Ref OAuthCallbackUrls]
            - !If
              - HasDomain
              - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/sim/callback,https://${DomainName}/sim/callback"
              - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/sim/callback"
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, RefreshToken: days }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/trackside-mcp
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: trackside }]

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trackside-mcp-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trackside-mcp-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/snapshots/*"
              # explain_race: Converse through the inference profile, which routes to the
              # Anthropic or Amazon Nova foundation models in the profile's regions.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - "arn:aws:bedrock:*::foundation-model/amazon.nova-*"
      Tags: [{ Key: Project, Value: trackside }]

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: trackside-mcp
      Description: Trackside MCP server (Streamable HTTP, stateless)
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 1024
      Timeout: 20
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TRACKSIDE_SNAPSHOT: !Sub "s3://${ArtifactBucket}/${SnapshotKey}"
          TRACKSIDE_AUTH_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
          TRACKSIDE_AUTH_DOMAIN: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
          TRACKSIDE_AUTH_CLIENTS: !Join [",", [!Ref ServiceClient, !Ref UserClient, !Ref SmokeClient]]
          # Cognito's names for the scopes; clients read them from the metadata and must ask
          # Cognito for exactly these.
          TRACKSIDE_SCOPE_SERVICE: trackside/mcp:service
          TRACKSIDE_SCOPE_TOOLS: trackside/mcp:tools
          TRACKSIDE_BEDROCK_MODEL: !Ref BedrockModel
          RUST_LOG: info
      Tags: [{ Key: Project, Value: trackside }]

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: trackside-mcp
      ProtocolType: HTTP
      Description: Public MCP endpoint for Trackside (/mcp)
      Tags: { Project: trackside }

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 25000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref RateLimit
        ThrottlingBurstLimit: !Ref BurstLimit
      Tags: { Project: trackside }

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # The simulator: a web page and a small server under /sim that plays the Alexa+ side of the
  # conversation. A Claude model on Bedrock picks the tools; the server calls them on the MCP
  # server above over HTTPS with the linked user's Cognito token, just as Alexa+ would.
  SimLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasSim
    Properties:
      LogGroupName: /aws/lambda/trackside-sim
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: trackside }]

  SimRole:
    Type: AWS::IAM::Role
    Condition: HasSim
    Properties:
      RoleName: trackside-sim-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trackside-sim-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${SimLogGroup.Arn}:*"
              # A cross-region inference profile (au., global.) runs the model in other
              # regions, so the foundation-model ARN is any region.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - "arn:aws:bedrock:*::foundation-model/amazon.nova-*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              # Spoken answers (Polly voices aren't resources, so this can't be narrower).
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"
      Tags: [{ Key: Project, Value: trackside }]

  SimFunction:
    Type: AWS::Lambda::Function
    Condition: HasSim
    DependsOn: SimLogGroup
    Properties:
      FunctionName: trackside-sim
      Description: Trackside simulator (a simulated Alexa+ experience over the MCP server)
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt SimRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref SimCodeKey
      Environment:
        Variables:
          TRACKSIDE_SIM_MCP_URL: !If [HasDomain, !Sub "https://${DomainName}/mcp", !Sub "${Api.ApiEndpoint}/mcp"]
          TRACKSIDE_SIM_MODEL: !Ref SimModel
          TRACKSIDE_SIM_TODAY: !Ref SimToday
          TRACKSIDE_SIM_VOICE: Olivia
          TRACKSIDE_SIM_AUTH_DOMAIN: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
          TRACKSIDE_SIM_CLIENT_ID: !Ref UserClient
          TRACKSIDE_SIM_CLIENT_SECRET: !GetAtt UserClient.ClientSecret
          RUST_LOG: info
      Tags: [{ Key: Project, Value: trackside }]

  SimIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: HasSim
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SimFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  SimRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasSim
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /sim
      Target: !Sub "integrations/${SimIntegration}"

  SimProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasSim
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /sim/{proxy+}
      Target: !Sub "integrations/${SimIntegration}"

  SimInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasSim
    Properties:
      FunctionName: !Ref SimFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # The custom hostname. The server builds its OAuth metadata URLs from the Host header, so
  # each hostname advertises itself and the execute-api URL keeps working.
  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags: { Project: trackside }

  CustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: Stage
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref CustomDomain
      Stage: $default

  CustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt CustomDomain.RegionalHostedZoneId

  # Daily refresh: rebuilds the odds-free snapshot from the racing archive (read-only) after
  # the day's results and again early for the next day's fields, then recycles the MCP
  # function so it serves the new snapshot.
  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasRefresh
    Properties:
      LogGroupName: /aws/lambda/trackside-refresh
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: trackside }]

  RefreshRole:
    Type: AWS::IAM::Role
    Condition: HasRefresh
    Properties:
      RoleName: trackside-refresh-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trackside-refresh-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${RefreshLogGroup.Arn}:*"
              # The archive is read-only to Trackside.
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-gamble-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-gamble-${AWS::AccountId}/*"
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-sectional-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::hr-${ArchiveEnv}-sectional-${AWS::AccountId}/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/snapshots/*"
              - Effect: Allow
                Action: lambda:UpdateFunctionConfiguration
                Resource: !GetAtt Function.Arn
      Tags: [{ Key: Project, Value: trackside }]

  RefreshFunction:
    Type: AWS::Lambda::Function
    Condition: HasRefresh
    DependsOn: RefreshLogGroup
    Properties:
      FunctionName: trackside-refresh
      Description: Rebuilds Trackside's racing snapshot from the archive (read-only)
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt RefreshRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref RefreshCodeKey
      Environment:
        Variables:
          HR_ENV: !Ref ArchiveEnv
          TRACKSIDE_SNAPSHOT_FROM: !Ref SnapshotFrom
          TRACKSIDE_SNAPSHOT_UPLOAD: !Sub "s3://${ArtifactBucket}/${SnapshotKey}"
          TRACKSIDE_MCP_FUNCTION: !Ref Function
      Tags: [{ Key: Project, Value: trackside }]

  # 12:00 and 20:00 UTC: about 10 or 11 pm in Melbourne after the day's results, and about 6
  # or 7 am with the day's final fields.
  RefreshSchedule:
    Type: AWS::Events::Rule
    Condition: HasRefresh
    Properties:
      Name: trackside-refresh
      Description: Rebuild Trackside's racing snapshot twice a day
      ScheduleExpression: cron(0 12,20 * * ? *)
      State: ENABLED
      Targets:
        - Id: refresh
          Arn: !GetAtt RefreshFunction.Arn

  RefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasRefresh
    Properties:
      FunctionName: !Ref RefreshFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RefreshSchedule.Arn

Outputs:
  McpUrl:
    Description: Point MCP clients (Inspector, Alexa+) here.
    Value: !If [HasDomain, !Sub "https://${DomainName}/mcp", !Sub "${Api.ApiEndpoint}/mcp"]
  ApiUrl:
    Description: The execute-api URL, which keeps working alongside a custom domain.
    Value: !Sub "${Api.ApiEndpoint}/mcp"
  RegionalHostname:
    Condition: HasDomain
    Description: CNAME target for DomainName when its DNS is hosted outside Route 53.
    Value: !GetAtt CustomDomain.RegionalDomainName
  FunctionName:
    Value: !Ref Function
  SimUrl:
    Condition: HasSim
    Description: The simulated Alexa+ experience, for demos and testing.
    Value: !If [HasDomain, !Sub "https://${DomainName}/sim", !Sub "${Api.ApiEndpoint}/sim"]
  OAuthDomain:
    Description: Cognito's authorize and token endpoints live here.
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  UserPoolId:
    Value: !Ref UserPool
  ServiceClientId:
    Description: client_credentials client (scope trackside/mcp:service). Secret via describe-user-pool-client.
    Value: !Ref ServiceClient
  SmokeClientId:
    Description: Test-only client_credentials client with both scopes, used by scripts/token.sh.
    Value: !Ref SmokeClient
  UserClientId:
    Description: Sign-in client for Alexa+, Claude and Inspector (code + PKCE). Secret via describe-user-pool-client.
    Value: !Ref UserClient
